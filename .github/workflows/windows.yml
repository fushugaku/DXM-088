name: Windows VST3 and CLAP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build Windows x64 plugins
        shell: pwsh
        run: ./tools/build-plugins.ps1
      - name: Rust and project compatibility checks
        shell: pwsh
        run: |
          $env:RUSTC = (rustup which --toolchain stable rustc)
          $env:RUSTDOC = (rustup which --toolchain stable rustdoc)
          rustup run stable cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup run stable cargo test --locked --manifest-path plugin/engine/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/verify-project-format.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/verify-pattern-bank.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tools/verify-performance.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Load CLAP module and verify public identity
        shell: pwsh
        run: python tools/verify-windows-module.py
      - uses: actions/upload-artifact@v4
        with:
          name: DXM-088-Windows-x64
          path: |
            build/plugins/DXM-088-*-Windows-x64.zip
            build/plugins/DXM-088-*-Windows-x64.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DXM-088-Windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release and its assets are preserved."
          else
            gh release create "$RELEASE_TAG" release/* --title "DXM-088 ${RELEASE_TAG#v}" --notes "DXM-088 for Windows x64: VST3 and CLAP with an offline web editor. All 128 MIDI notes trigger independent patterns while held. Extract the ZIP and run Install.cmd. Keep the CLAP resources beside its module. Microsoft WebView2 Runtime is required."
          fi
